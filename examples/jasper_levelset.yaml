# ============================================================
# IGNACIO: Jasper Level Set Configuration (Example)
# ============================================================
# Level set fire spread simulation for the 2024 Jasper Wildfire
# Complex with 4-parameter calibration.
#
# Data requirements (place in ./data/ relative to this file):
#   - DEM.tif          : Digital elevation model
#   - Fuel.tif         : FBP fuel type raster
#   - Jasper_Ignition.shp : Ignition point(s)
#   - stations.csv     : Hourly weather observations
#   - Jasper_Wildfire_Complex_2024.shp : Observed perimeter (for calibration)
# ============================================================

project:
  name: "Jasper_LevelSet"
  description: "Jasper Fire simulation using level set solver"
  output_dir: "./output"
  random_seed: 42

crs:
  working_crs: "EPSG:4326"
  output_crs: "EPSG:4326"

terrain:
  dem_path: "./data/DEM.tif"
  slope_path: null
  aspect_path: null

fuel:
  source_type: "raster"
  path: "./data/Fuel.tif"
  non_fuel_codes: [0, 100, 101, 102, 103, 104, 105, 106, -9999]
  fuel_lookup:
    1: "C-1"
    2: "C-2"
    3: "C-3"
    4: "C-4"
    5: "C-5"
    6: "C-6"
    7: "C-7"
    11: "D-1"
    12: "D-1"
    13: "D-1"
    21: "S-1"
    22: "S-2"
    23: "S-3"
    31: "O-1a"
    32: "O-1b"
    40: "M-1"
    50: "M-2"
    60: "M-1"
    70: "M-3"
    80: "M-4"
    90: "M-3"
    100: "NF"
    101: "NF"
    102: "WA"
    103: "NF"
    104: "NF"
    105: "NF"
    106: "NF"
    # M-1 Boreal Mixedwood - Leafless (with % conifer encoded)
    405: "M-1"
    410: "M-1"
    415: "M-1"
    420: "M-1"
    425: "M-1"
    430: "M-1"
    435: "M-1"
    440: "M-1"
    445: "M-1"
    450: "M-1"
    455: "M-1"
    460: "M-1"
    465: "M-1"
    470: "M-1"
    475: "M-1"
    480: "M-1"
    485: "M-1"
    490: "M-1"
    495: "M-1"
    # M-2 Boreal Mixedwood - Green (with % conifer encoded)
    505: "M-2"
    510: "M-2"
    515: "M-2"
    520: "M-2"
    525: "M-2"
    530: "M-2"
    535: "M-2"
    540: "M-2"
    545: "M-2"
    550: "M-2"
    555: "M-2"
    560: "M-2"
    565: "M-2"
    570: "M-2"
    575: "M-2"
    580: "M-2"
    585: "M-2"
    590: "M-2"
    595: "M-2"
    # M-1/M-2 Boreal Mixedwood (with % conifer encoded)
    605: "M-1"
    610: "M-1"
    615: "M-1"
    620: "M-1"
    625: "M-1"
    630: "M-1"
    635: "M-1"
    640: "M-1"
    645: "M-1"
    650: "M-1"
    655: "M-1"
    660: "M-1"
    665: "M-1"
    670: "M-1"
    675: "M-1"
    680: "M-1"
    685: "M-1"
    690: "M-1"
    695: "M-1"

fuel_breaks:
  - enabled: false
    path: ./data/fuel_break.shp
    buffer_m: 15.0
    all_touched: true
    preserve_non_fuel: true
    treatment_method: fuel_code
    fuel_code: 32

ignition:
  source_type: "shapefile"
  point_path: "./data/Jasper_Ignition.shp"
  cause: "Lightning"
  season: "Summer"
  n_iterations: 1
  escaped_fire_distribution:
    1: 1.0

weather:
  station_path: "./data/stations.csv"
  weather_path: null
  calculate_fwi: true
  fwi_latitude: 52.35

  weather_columns:
    datetime: "Date (Local Standard Time)"
    temperature: "TEMP"
    relative_humidity: "RH"
    wind_speed: "WS"
    wind_direction: "WD"
    precipitation: "PRECIP"

  datetime_format: "%Y-%m-%d %H:%M"

  isi_thresholds:
    moderate: 0.0
    high: 3.0
    extreme: 6.0

  filter_conditions: ["moderate", "high", "extreme"]
  spread_event_lambda: 3.76

fbp:
  defaults:
    ffmc: 88.0
    dmc: 30.0
    dc: 150.0
    isi: 5.0
    bui: 50.0
    fwi: 15.0
  fmc: 100.0
  curing: 85.0
  slope_factor: 0.5
  backing_fraction: 0.2
  length_to_breadth: 2.0
  ros_scale: 0.037

simulation:
  dt: 60.0                  # hourly timesteps (minutes)
  max_duration: 40320       # 28 days in minutes (672 hourly steps)
  n_vertices: 300
  initial_radius: 10.0
  store_every: 24
  min_ros: 0.01
  spread_method: "levelset" # use level set solver instead of marker method
  level_set:
    cfl_factor: 0.5
    reinit_interval: 5
    reinit_iters: 10

  marker_method:
    enabled: true
    epsilon: 10.0

  time_varying_weather: true
  start_datetime: "2024-07-09 00:00:00"
  default_start_hour: 0

output:
  save_perimeters: true
  save_ros_grids: true
  save_weather_summary: true
  save_ignition_summary: true
  perimeter_format: "shapefile"
  combine_perimeters: true
  generate_plots: true
  generate_animation: false
  log_level: "INFO"

calibration:
  enabled: true
  observed_perimeter_path: "./data/Jasper_Wildfire_Complex_2024.shp"
  method: "nelder-mead"
  params: ["ros_scale", "backing_scale", "flanking_scale", "wind_direction_offset"]
  n_iters: 60
  learning_rate: 0.01
  max_steps: 672
  resolution: 0.001
